<style>
:root{
  --r:#9B1B2E;--rd:#6B1020;--rl:#C42240;
  --g:#1D6B4F;--gd:#145038;--gl:#2E9070;
  --bg:#F5EDE0;--bgd:#EAD9C4;--card:#FDFAF5;
  --tx:#2A2020;--txl:#7A6A65;--bdr:#E0D0C0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:130px;font-size:15px;}

/* ── NAV ── */
.nav{position:fixed;bottom:52px;left:0;right:0;background:var(--rd);display:flex;z-index:200;border-top:2px solid var(--r);}
.nb{flex:1;background:none;border:none;color:rgba(255,255,255,.5);padding:10px 4px 8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.65rem;font-weight:500;}
.nb .ic{font-size:1.2rem;}
.nb.on{color:#F5EDE0;}

/* ── HEADER ── */
.hdr{background:var(--rd);color:#F5EDE0;padding:14px 18px;display:flex;align-items:center;gap:10px;min-height:52px;}
.hdr h1{font-size:1rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.back{background:none;border:none;color:#F5EDE0;font-size:1.4rem;cursor:pointer;padding:2px 8px 2px 0;line-height:1;}
.ha{background:rgba(255,255,255,.15);border:none;color:#F5EDE0;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:500;}

/* ── VIEWS ── */
.view{display:none;}.view.on{display:block;}

/* ── LAYOUT ── */
.pg{padding:18px;max-width:680px;margin:0 auto;}
h2{font-size:1rem;font-weight:700;color:var(--rd);margin-bottom:14px;border-bottom:2px solid var(--bgd);padding-bottom:7px;}
h3{font-size:.9rem;font-weight:600;color:var(--rd);}
.card{background:var(--card);border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid var(--bdr);box-shadow:0 2px 6px rgba(107,16,32,.05);}

/* ── SYNC STATUS ── */
.sync-bar{background:rgba(29,107,79,.9);color:white;text-align:center;padding:6px;font-size:.75rem;font-weight:600;display:none;}
.sync-bar.show{display:block;}
.sync-bar.err{background:rgba(155,27,46,.9);}
.offline-warn{background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:10px 14px;font-size:.82rem;margin-bottom:14px;display:none;}
.offline-warn.show{display:block;}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,var(--rd),var(--r));color:#F5EDE0;border-radius:14px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden;cursor:pointer;}
.hero::after{content:'📚';font-size:5rem;position:absolute;right:14px;bottom:-10px;opacity:.1;pointer-events:none;}
.hero-lbl{font-size:.7rem;opacity:.7;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;font-weight:600;}
.hero-ttl{font-size:1.25rem;font-weight:700;margin-bottom:3px;line-height:1.3;}
.hero-auth{font-size:.85rem;opacity:.78;}

/* ── STATS ── */
.stat-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px;}
.sc{flex:1;min-width:75px;background:var(--card);border-radius:10px;padding:13px 10px;text-align:center;border:1px solid var(--bdr);}
.sn{font-size:1.6rem;color:var(--r);font-weight:700;}
.sl{font-size:.68rem;color:var(--txl);margin-top:2px;font-weight:500;}

/* ── QUOTES ── */
.q-hero{background:var(--card);border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid var(--bdr);border-left:4px solid var(--r);box-shadow:0 2px 8px rgba(107,16,32,.07);cursor:pointer;}
.q-hero .qt{font-style:italic;font-size:.97rem;line-height:1.65;color:var(--tx);margin-bottom:8px;}
.q-hero .qm{font-size:.78rem;color:var(--txl);}
.q-hero .qb{color:var(--r);font-weight:600;}

/* ── BOOK CARDS ── */
.brow{display:flex;gap:13px;align-items:flex-start;cursor:pointer;}
.bcover{width:56px;flex-shrink:0;height:78px;border-radius:6px;background:var(--bgd);display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden;}
.bcover img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.bi{flex:1;min-width:0;}
.bt{font-size:.95rem;font-weight:600;color:var(--rd);margin-bottom:2px;}
.ba{font-size:.8rem;color:var(--txl);margin-bottom:4px;}
.by2{font-size:.75rem;color:var(--txl);}

/* ── BADGES ── */
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:600;}
.b-read{background:#d4edda;color:#155724;}
.b-reading{background:#fff3cd;color:#7d6008;}
.b-want{background:#d1ecf1;color:#0c5460;}
.mtag{font-size:.72rem;background:var(--g);color:white;padding:2px 9px;border-radius:20px;display:inline-block;margin-bottom:5px;font-weight:600;}

/* ── STARS ── */
.stars span{font-size:1.3rem;cursor:pointer;color:#ccc;transition:color .1s;}
.stars span.on{color:#c8922a;}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tb{background:none;border:none;padding:9px 14px;font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--txl);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tb.on{color:var(--r);border-bottom-color:var(--r);font-weight:700;}
.tp{display:none;}.tp.on{display:block;}

/* ── YEAR/MONTH ── */
.ytabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.yt{padding:7px 18px;border-radius:20px;border:2px solid var(--r);background:none;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:600;color:var(--r);}
.yt.on{background:var(--r);color:white;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.mc{background:var(--card);border-radius:10px;padding:13px;border:1px solid var(--bdr);cursor:pointer;transition:all .15s;text-align:center;}
.mc:hover{border-color:var(--r);box-shadow:0 3px 10px rgba(107,16,32,.1);}
.mc.hb{border-color:var(--g);}
.mc.curr{border-color:var(--r);border-width:2px;background:rgba(155,27,46,.04);}
.mn{font-size:.78rem;color:var(--txl);margin-bottom:5px;font-weight:500;}
.mbt{font-size:.85rem;color:var(--rd);font-weight:700;line-height:1.3;}

/* ── FORMS ── */
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:.78rem;font-weight:600;color:var(--txl);margin-bottom:3px;}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--bdr);border-radius:8px;font-family:'Montserrat',sans-serif;font-size:.88rem;background:white;color:var(--tx);}
textarea{min-height:75px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g);}

/* ── BUTTONS ── */
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;transition:opacity .15s;}
.btn:active{opacity:.8;}
.bp{background:var(--r);color:white;}
.bs{background:var(--g);color:white;}
.bg2{background:var(--bgd);color:var(--rd);}
.bd{background:#c0392b;color:white;}
.sm{padding:5px 12px;font-size:.78rem;}

/* ── PROFILE ── */
.phdr{background:linear-gradient(135deg,var(--gd),var(--g));color:white;border-radius:14px;padding:22px;text-align:center;margin-bottom:18px;}
.av-lg{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;margin:0 auto 10px;border:2px solid rgba(255,255,255,.4);}

/* ── COMMENTS ── */
.cmt{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bdr);}
.cmt-by{font-size:.78rem;color:var(--g);font-weight:700;margin-bottom:4px;}
.cmt-date{color:var(--txl);font-weight:400;}
.cmt-txt{font-size:.9rem;line-height:1.55;margin-bottom:8px;}
.replies{margin-left:14px;border-left:2px solid var(--bgd);padding-left:12px;margin-top:8px;}
.reply{background:var(--bg);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:.85rem;}
.reply-by{font-size:.73rem;color:var(--g);font-weight:700;margin-bottom:3px;}

/* ── REACTIONS ── */
.rxns{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.rxn{background:var(--bg);border:1px solid var(--bdr);border-radius:20px;padding:3px 9px;cursor:pointer;font-size:.8rem;user-select:none;font-family:inherit;}
.rxn:hover,.rxn.mine{border-color:var(--r);background:rgba(155,27,46,.07);color:var(--r);font-weight:600;}
.rxn-add{background:none;border:1px dashed var(--bdr);border-radius:20px;padding:3px 8px;cursor:pointer;font-size:.8rem;color:var(--txl);font-family:inherit;}
.rxn-add:hover{border-color:var(--r);color:var(--r);}
.rxn-picker{display:none;position:fixed;background:white;border:1px solid var(--bdr);border-radius:12px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:500;font-size:1.3rem;gap:6px;flex-wrap:wrap;width:220px;}
.rxn-picker.show{display:flex;}
.rxn-picker span{cursor:pointer;padding:5px;border-radius:6px;transition:background .1s;}
.rxn-picker span:hover{background:var(--bgd);}

/* ── QUOTE ── */
.qt-item{background:var(--bg);border-left:3px solid var(--r);border-radius:0 8px 8px 0;padding:11px 14px;margin-bottom:9px;}
.qt-txt{font-style:italic;font-size:.93rem;line-height:1.6;margin-bottom:6px;}
.qt-meta{font-size:.75rem;color:var(--txl);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}

/* ── QUESTION ── */
.qi{background:var(--card);border-radius:10px;padding:13px;margin-bottom:10px;border:1px solid var(--bdr);}
.qq{font-weight:700;color:var(--rd);margin-bottom:8px;font-size:.9rem;}
.ans{background:var(--bg);border-radius:7px;padding:8px 11px;margin-bottom:5px;font-size:.85rem;}
.ans-by{font-size:.72rem;color:var(--g);font-weight:700;margin-bottom:2px;}

/* ── AUDIO PLAYLIST ── */
.playlist{background:var(--bg);border-radius:12px;padding:16px;border:1px solid var(--bdr);margin-bottom:12px;}
.playlist-title{font-size:.75rem;font-weight:700;color:var(--g);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;}
.playlist-player{background:white;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--bdr);}
.playlist-player audio{width:100%;margin-top:6px;}
.now-playing{font-size:.85rem;font-weight:600;color:var(--rd);margin-bottom:4px;}
.now-playing-sub{font-size:.75rem;color:var(--txl);}
.track-list{display:flex;flex-direction:column;gap:6px;}
.track{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.track:hover{background:white;border-color:var(--bdr);}
.track.active{background:white;border-color:var(--r);}
.track-num{font-size:.75rem;font-weight:700;color:var(--txl);min-width:20px;}
.track.active .track-num{color:var(--r);}
.track-name{flex:1;font-size:.85rem;font-weight:500;}
.track.active .track-name{color:var(--r);font-weight:700;}
.track-play{font-size:1rem;color:var(--txl);}
.track.active .track-play{color:var(--r);}
.playlist-nav{display:flex;gap:8px;margin-top:10px;justify-content:center;}
.add-track-form{background:white;border-radius:8px;padding:12px;margin-top:10px;border:1px solid var(--bdr);}

/* ── BOOK COVER ── */
.bk-cover-lg{max-width:150px;height:210px;border-radius:10px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,.15);display:block;}
.bk-cover-ph{width:150px;height:210px;border-radius:10px;background:linear-gradient(135deg,var(--rd),var(--r));display:flex;align-items:center;justify-content:center;font-size:3.5rem;box-shadow:0 4px 16px rgba(0,0,0,.12);}

/* ── READING LOG ── */
.log-entry{background:var(--bg);border-radius:8px;padding:9px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;font-size:.85rem;}
.log-pct{font-weight:700;color:var(--r);font-size:1rem;min-width:42px;}
.log-bar-wrap{flex:1;height:6px;background:var(--bgd);border-radius:3px;overflow:hidden;}
.log-bar{height:100%;background:linear-gradient(90deg,var(--r),var(--rl));border-radius:3px;}

/* ── VOTE ── */
.vote-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:7px;border:1px solid var(--bdr);cursor:pointer;}
.vote-opt:hover,.vote-opt.voted{border-color:var(--r);background:rgba(155,27,46,.05);}
.vote-bar-wrap{flex:1;height:7px;background:var(--bgd);border-radius:4px;overflow:hidden;}
.vote-bar{height:100%;background:linear-gradient(90deg,var(--r),var(--rl));border-radius:4px;transition:width .4s;}

/* ── ANNOUNCE ── */
.ann{background:linear-gradient(135deg,rgba(155,27,46,.07),rgba(155,27,46,.02));border:1px solid rgba(155,27,46,.18);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.ann-ttl{font-size:.88rem;font-weight:700;color:var(--rd);margin-bottom:4px;}
.ann-txt{font-size:.83rem;color:var(--tx);line-height:1.5;}
.ann-date{font-size:.72rem;color:var(--txl);margin-top:5px;}

/* ── MEMBER GRID ── */
.mgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.mcard{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--bdr);}
.mav{width:44px;height:44px;border-radius:50%;background:var(--r);color:white;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;margin:0 auto 8px;}
.admin-badge{font-size:.65rem;background:var(--rd);color:white;padding:1px 7px;border-radius:10px;display:inline-block;margin-top:3px;font-weight:600;}

/* ── COLLAPSIBLE ── */
.coll-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;user-select:none;}
.coll-hdr h3{margin:0;}
.coll-ico{color:var(--r);transition:transform .2s;font-size:1rem;}
.coll-body{display:none;margin-top:10px;}
.coll.open .coll-ico{transform:rotate(180deg);}
.coll.open .coll-body{display:block;}

/* ── ADD PANEL ── */
.addpanel{display:none;background:var(--card);border-bottom:2px solid var(--bdr);padding:18px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fgrid .s2{grid-column:1/-1;}
@media(max-width:500px){.fgrid{grid-template-columns:1fr;}.fgrid .s2{grid-column:1;}}

/* ── MISC ── */
.row{display:flex;gap:8px;flex-wrap:wrap;}
.empty{text-align:center;color:var(--txl);padding:28px;font-style:italic;font-size:.88rem;}
.admin-only{border:1px dashed var(--rl);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.78rem;color:var(--rl);text-align:center;cursor:pointer;font-weight:500;}

/* ── DARK MODE ── */
body.dark{--bg:#181212;--bgd:#221616;--card:#261A1A;--tx:#F0E8E0;--txl:#9A8878;--bdr:#3A2424;color-scheme:dark;}
body.dark .nav{background:#0E0808;border-top-color:#2A1414;}
body.dark .hdr{background:#0E0808;}
body.dark .hero{background:linear-gradient(135deg,#5a0a18,#8B1020);}
body.dark .phdr{background:linear-gradient(135deg,#0d3d2c,#1a5c3f);}
body.dark .sync-bar{background:rgba(20,70,50,.95);}
body.dark input,body.dark select,body.dark textarea{background:#221616;color:var(--tx);border-color:var(--bdr);}
body.dark audio{filter:invert(.1) brightness(1.1);}
body.dark .stars span{color:#5a4a3a;}
body.dark .stars span.on{color:#d4a030;}

/* ── SEARCH OVERLAY ── */
.srch-ov{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;padding-bottom:80px;}
.srch-ov.show{display:block;}
.srch-top{background:var(--rd);padding:10px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;}
.srch-inp{flex:1;padding:9px 14px;border-radius:8px;border:none;font-family:inherit;font-size:.92rem;background:rgba(255,255,255,.95);color:#2A2020;}
.srch-empty{text-align:center;padding:32px 20px;}
.srch-empty .srch-title{font-size:1rem;font-weight:600;color:var(--rd);margin-bottom:8px;}
.srch-empty .srch-sub{font-size:.83rem;color:var(--txl);margin-bottom:16px;}
.srch-count{font-size:.8rem;color:var(--txl);margin-bottom:10px;padding:0 2px;}

/* ── NEW BADGE (unread dot) ── */
.has-new{position:relative;}
.new-dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:#e74c3c;border-radius:50%;border:2px solid var(--card);pointer-events:none;}

/* ── GROUP PROGRESS ── */
.grp-prog{display:flex;gap:8px;margin:10px 0 4px;}
.grp-item{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:9px 6px;border:1px solid var(--bdr);}
.grp-n{font-size:1.2rem;font-weight:700;color:var(--r);}
.grp-l{font-size:.65rem;color:var(--txl);margin-top:1px;font-weight:500;}

/* ── KONSPEKT (notes) ── */
.note-body{font-size:.88rem;line-height:1.75;color:var(--tx);}
.note-body h1,.note-body h2{font-size:.98rem;font-weight:700;color:var(--rd);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--bdr);}
.note-body h3{font-size:.9rem;font-weight:700;color:var(--rd);margin:12px 0 4px;}
.note-body p{margin-bottom:8px;}
.note-body hr{border:none;border-top:1px solid var(--bdr);margin:14px 0;}
.note-body blockquote{border-left:3px solid var(--r);padding:6px 12px;margin:8px 0;background:rgba(155,27,46,.05);border-radius:0 6px 6px 0;font-style:italic;}
.note-callout{background:var(--bgd);border-radius:8px;padding:10px 14px;margin:8px 0;display:flex;gap:9px;align-items:flex-start;}
.note-callout .ico{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
.note-callout .txt{font-size:.85rem;line-height:1.6;}
.note-body strong{font-weight:700;color:var(--rd);}
.note-body ul,.note-body ol{padding-left:18px;margin-bottom:8px;}
.note-body li{margin-bottom:3px;}
.note-sync{font-size:.72rem;color:var(--txl);text-align:right;margin-top:10px;padding-top:8px;border-top:1px solid var(--bdr);}
.note-empty{text-align:center;padding:32px 20px;color:var(--txl);}
.note-empty .ico{font-size:2.5rem;margin-bottom:8px;}

/* ── ADAPTATION CARD ── */
.adapt-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);overflow:hidden;margin-bottom:14px;}

/* ── COUNTDOWN CHIP ── */

<script>
// ══════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════
const MRU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MRU_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const CLUB_START=new Date(2024,9);

// ══════════════════════════════════════════════
//  FIREBASE INIT
// ══════════════════════════════════════════════
let db=null, fbOk=false;

function initFirebase(){
  try{
    if(FIREBASE_CONFIG.apiKey==='ВСТАВЬТЕ_СЮДА'){
      console.warn('Firebase не настроен — работаем локально');
      document.getElementById('offline-warn').classList.add('show');
      return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    fbOk=true;
    syncShow('✅ Подключено к Firebase','');
    setTimeout(()=>syncHide(),2000);
  }catch(e){
    console.error('Firebase error:',e);
    document.getElementById('offline-warn').classList.add('show');
  }
}

function syncShow(msg,cls){
  const el=document.getElementById('sync-bar');
  el.textContent=msg; el.className='sync-bar show '+(cls||'');
}
function syncHide(){document.getElementById('sync-bar').classList.remove('show');}

// Firebase helpers
function fbGet(path){
  if(!fbOk)return Promise.resolve(null);
  return db.ref(path).get().then(s=>s.val());
}
function fbSet(path,val){
  if(!fbOk){saveLocal();return Promise.resolve();}
  syncShow('🔄 Сохранение...');
  return db.ref(path).set(val)
    .then(()=>{syncShow('✅ Сохранено','');setTimeout(syncHide,1500);})
    .catch(e=>{syncShow('⚠️ Ошибка сохранения','err');console.error(e);});
}
function fbPush(path,val){
  if(!fbOk){saveLocal();return Promise.resolve({key:'local_'+Date.now()});}
  syncShow('🔄 Сохранение...');
  const ref=db.ref(path).push();
  return ref.set(val)
    .then(()=>{syncShow('✅ Сохранено','');setTimeout(syncHide,1500);return ref;})
    .catch(e=>{syncShow('⚠️ Ошибка','err');return ref;});
}
function fbDel(path){
  if(!fbOk){saveLocal();return Promise.resolve();}
  return db.ref(path).remove();
}
function fbListen(path,cb){
  if(!fbOk)return;
  db.ref(path).on('value',s=>cb(s.val()));
}

// ══════════════════════════════════════════════
//  LOCAL DATA (fallback when no Firebase)
// ══════════════════════════════════════════════
let D={profile:{name:'Участник',avatar:'У',isAdmin:false},books:[],statuses:{},
       comments:{},quotes:{},questions:{},votes:{options:[]},members:[],announcements:[],progress:{},groupstatuses:{},ratings:{},adaptations:{},notes:{},
       config:{proCode:'',payInfo:{price:'',contact:'',details:'',payUrl:''},bookPayInfo:{}},suggestions:{},personalReviews:{}};

function loadLocal(){
  try{const s=localStorage.getItem('vrk5');if(s)D=JSON.parse(s);}catch(e){}
  if(!D.books)D.books=[];
  if(!D.statuses)D.statuses={};
  if(!D.comments)D.comments={};
  if(!D.quotes)D.quotes={};
  if(!D.questions)D.questions={};
  if(!D.votes)D.votes={options:[]};
  if(!D.members)D.members=[];
  if(!D.announcements)D.announcements=[];
  if(!D.progress)D.progress={};
  if(!D.profile)D.profile={name:'Участник',avatar:'У',isAdmin:false};
  if(!D.groupstatuses)D.groupstatuses={};
  if(!D.ratings)D.ratings={};
  if(!D.adaptations)D.adaptations={};
  if(!D.notes)D.notes={};
  if(!D.suggestions)D.suggestions={};
  if(!D.personalReviews)D.personalReviews={};
  if(!D.config)D.config={proCode:'',payInfo:{price:'',contact:'',details:''}};
  if(!D.config.payInfo)D.config.payInfo={price:'',contact:'',details:'',payUrl:''};
  if(!D.config.payInfo.payUrl)D.config.payInfo.payUrl='';
  if(!D.config.bookPayInfo)D.config.bookPayInfo={};
}
function saveLocal(){try{localStorage.setItem('vrk5',JSON.stringify(D));}catch(e){}}

function initBooks(){
  const _seed=()=>[
    {id:'b1',title:'Прачечная, стирающая печали',author:'Сон Вон Пён',yearPublished:2016,readingMonth:'2024-10',emoji:'🌊',coverUrl:'',audioUrl:'',bookUrl:'',description:'Корейский роман о прачечной, где стирают не только одежду, но и горе.'},
    {id:'b2',title:'Атомные привычки',author:'Джеймс Клир',yearPublished:2018,readingMonth:'2024-11',emoji:'⚛️',coverUrl:'',audioUrl:'',bookUrl:'',description:'Как небольшие изменения приводят к выдающимся результатам.'},
    {id:'b3',title:'Вафельное сердце',author:'Мария Парр',yearPublished:2005,readingMonth:'2024-12',emoji:'🧇',coverUrl:'',audioUrl:'',bookUrl:'',description:'Норвежская повесть о дружбе и взрослении.'},
    {id:'b4',title:'Сила воли',author:'Келли Макгонигал',yearPublished:2011,readingMonth:'2025-01',emoji:'💪',coverUrl:'',audioUrl:'',bookUrl:'',description:'Как развить самоконтроль и работать с инстинктами.'},

//  FIREBASE REAL-TIME SYNC
// ══════════════════════════════════════════════
function setupListeners(){
  if(!fbOk)return;
  fbListen('books',val=>{if(val){const arr=Object.values(val);D.books=arr.length?arr:D.books;}renderIfActive('catalog');renderIfActive('club');renderIfActive('home');});
  fbListen('comments',val=>{D.comments=val||{};if(curV==='book')renderBook(curBk);});
  fbListen('quotes',val=>{D.quotes=val||{};if(curV==='book')renderBook(curBk);renderIfActive('home');});
  fbListen('questions',val=>{D.questions=val||{};if(curV==='book')renderBook(curBk);});
  fbListen('votes',val=>{D.votes=val||{options:[]};renderIfActive('club');});
  fbListen('members',val=>{D.members=val?Object.values(val):[];renderIfActive('club');renderIfActive('profile');});
  fbListen('announcements',val=>{D.announcements=val?Object.values(val):[];renderIfActive('home');});
  fbListen('groupstatuses',val=>{D.groupstatuses=val||{};if(curV==='book')renderBook(curBk);});
  fbListen('ratings',val=>{D.ratings=val||{};if(curV==='book')renderBook(curBk);});
  fbListen('adaptations',val=>{D.adaptations=val||{};if(curV==='book')renderBook(curBk);});
  fbListen('notes',val=>{if(val)Object.assign(D.notes,val);if(curV==='book')renderBook(curBk);});
  fbListen('suggestions',val=>{D.suggestions=val||{};if(curV==='book')renderBook(curBk);renderIfActive('club');});
  fbListen('personalReviews',val=>{D.personalReviews=val||{};if(curV==='book')renderBook(curBk);});
  fbListen('config',val=>{
    if(val){
      D.config={...D.config,...val};
      if(val.payInfo)D.config.payInfo={...D.config.payInfo,...val.payInfo};
      if(val.bookPayInfo)D.config.bookPayInfo={...D.config.bookPayInfo,...val.bookPayInfo};
    }
    if(curV==='book')renderBook(curBk);
    renderIfActive('catalog');renderIfActive('profile');
  });
  // Per-user data (statuses, progress) stored locally AND in firebase under user key
  const uKey=userKey();
  fbListen('userdata/'+uKey+'/statuses',val=>{D.statuses=val||{};if(curV==='book')renderBook(curBk);renderIfActive('profile');});
  fbListen('userdata/'+uKey+'/progress',val=>{D.progress=val||{};if(curV==='book')renderBook(curBk);renderIfActive('profile');});
}

function userKey(){return(D.profile.name||'user').replace(/[^a-zA-Zа-яёА-ЯЁ0-9]/g,'_');}

// ── PREMIUM ACCESS ──
function isPro(bid){
  if(isAdmin())return true;
  if(localStorage.getItem('vrk-pro')==='1')return true;
  if(bid&&localStorage.getItem('vrk-book-'+bid)==='1')return true;
  return false;
}
function getProCode(){return(D.config&&D.config.proCode&&D.config.proCode.trim())||DEFAULT_PRO_CODE;}
function tryUnlockPro(){
  const inp=document.getElementById('pro-code-in');
  if(!inp)return;
  const code=inp.value.trim();
  if(!code){alert('Введи код доступа');return;}
  const proCode=getProCode();
  if(!proCode){alert('Код доступа ещё не настроен организатором.');return;}
  if(code.toUpperCase()===proCode.toUpperCase()){
    localStorage.setItem('vrk-pro','1');
    inp.value='';
    renderProfile();
    if(curV==='book')renderBook(curBk);
    renderIfActive('catalog');
    alert('🎉 Доступ открыт! Конспекты и личная библиотека теперь доступны.');
  } else {
    alert('Неверный код. Уточни у организатора.');
  }
}
function revokePro(){localStorage.removeItem('vrk-pro');renderProfile();if(curV==='book')renderBook(curBk);renderIfActive('catalog');}
function getBookCode(bid){
  return(D.config&&D.config.bookPayInfo&&D.config.bookPayInfo[bid]&&D.config.bookPayInfo[bid].code)||'';
}
function showBookPaywall(bid){
  // Find and click the Konspekt tab button
  const allTabs=document.querySelectorAll('.tb');
  let noteTab=null;
  allTabs.forEach(t=>{if(t.textContent.includes('Конспект'))noteTab=t;});
  if(noteTab){
    noteTab.click();
    setTimeout(()=>noteTab.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
    return;
  }
  // Fallback: scroll to note pane
  const notePane=document.getElementById('btp-note-'+bid);
  if(notePane)notePane.scrollIntoView({behavior:'smooth',block:'start'});
}
function tryUnlockBook(bid){
  const inp=document.getElementById('book-code-in-'+bid);
  if(!inp)return;
  const code=inp.value.trim();
  if(!code){alert('Введи код доступа');return;}
  const bookCode=getBookCode(bid);
  const globalCode=getProCode();
  if(!bookCode&&!globalCode){alert('Код доступа ещё не настроен. Обратись к организатору.');return;}
  if(bookCode&&code.toUpperCase()===bookCode.toUpperCase()){
    localStorage.setItem('vrk-book-'+bid,'1');
    renderBook(bid);
    alert('🎉 Доступ к конспекту открыт!');
  } else if(globalCode&&code.toUpperCase()===globalCode.toUpperCase()){
    localStorage.setItem('vrk-pro','1');
    renderBook(bid);
    alert('🎉 Доступ ко всем конспектам открыт!');
  } else {
    alert('Неверный код. Проверь код или обратись к организатору.');
  }
}
function paywallCard(section, bid){
  const info=(D.config&&D.config.payInfo)||{};
  const bInfo=(bid&&D.config&&D.config.bookPayInfo&&D.config.bookPayInfo[bid])||{};
  const bookPrice=bInfo.price||'';
  const bookUrl=bInfo.payUrl||'';
  const bundlePrice=info.price||'';
  const bundleUrl=info.payUrl||'';
  const bPriceHtml=bookPrice?'<div class="pw-opt-price">'+x(bookPrice)+'</div>':'<div class="pw-opt-price" style="font-size:.85rem;color:var(--txl);">цена по запросу</div>';
  const bBtnHtml=bookUrl?'<a href="'+x(bookUrl)+'" target="_blank" class="btn bp" style="font-size:.82rem;padding:8px 14px;text-decoration:none;">Купить →</a>':'<button class="btn bp" style="font-size:.82rem;padding:8px 14px;" onclick="go(\'pro\')">Купить →</button>';
  const bndlPriceHtml=bundlePrice?'<div class="pw-opt-price">'+x(bundlePrice)+'</div>':'<div class="pw-opt-price" style="font-size:.85rem;color:var(--txl);">выгодно</div>';
  const bndlBtnHtml=bundleUrl?'<a href="'+x(bundleUrl)+'" target="_blank" class="btn bp" style="font-size:.82rem;padding:8px 14px;text-decoration:none;">Купить всё →</a>':'<button class="btn bp" style="font-size:.82rem;padding:8px 14px;" onclick="go(\'pro\')">Купить всё →</button>';
  const codeInputId='book-code-in-'+(bid||'x');
  const unlockCall='tryUnlockBook('+"'"+(bid||'')+"'"+ ')';
  return '<div class="paywall-card">'
    +'<div class="paywall-lock">🔒</div>'
    +'<div class="paywall-title">Платный раздел</div>'
    +'<div class="paywall-desc">'+x(section)+' доступен по подписке</div>'
    +'<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;">'
      +'<div class="pw-option pw-single">'
        +'<div class="pw-opt-label">Один конспект</div>'
        +bPriceHtml+bBtnHtml
      +'</div>'
      +'<div class="pw-option pw-bundle">'
        +'<div class="pw-opt-label">Все конспекты 🔥</div>'
        +bndlPriceHtml+bndlBtnHtml
      +'</div>'
    +'</div>'
    +'<div style="margin-top:4px;">'
      +'<div style="font-size:.75rem;color:var(--txl);margin-bottom:6px;">Уже оплатила? Введи код:</div>'
      +'<div style="display:flex;gap:6px;">'
        +'<input id="'+codeInputId+'" placeholder="Код доступа..." style="flex:1;font-size:.85rem;" />'
        +'<button class="btn bp sm" onclick="'+unlockCall+'">Открыть</button>'
      +'</div>'
    +'</div>'
    +'</div>';
}

function renderIfActive(v){if(curV===v){if(v==='home')renderHome();if(v==='catalog')renderCatalog();if(v==='club')renderClub();if(v==='profile')renderProfile();}}

let curV='home',prevV='home',curBk=null,catF='all',selYr=null,editId=null,rxnCtx=null;

function go(v){
  if(v==='pro'){prevV=curV;curV='pro';renderProLanding();window.scrollTo(0,0);return;}
  prevV=curV;curV=v;
  document.getElementById('srch-ov').classList.remove('show');
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  const nb=document.getElementById('nb-'+v);if(nb)nb.classList.add('on');
  if(v==='home')renderHome();
  if(v==='catalog')renderCatalog();
  if(v==='club')renderClub();
  if(v==='profile')renderProfile();
  window.scrollTo(0,0);
}
function openBook(id){
  prevV=curV;curBk=id;curV='book';
  document.getElementById('srch-ov').classList.remove('show');
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.getElementById('v-book').classList.add('on');
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  markVisit(id);
  renderBook(id);window.scrollTo(0,0);
}
function goBack(){go(prevV||'home');}

        <div class="fg"><input id="ann-t" placeholder="Заголовок"/></div>
        <div class="fg"><textarea id="ann-tx" placeholder="Текст..." style="min-height:60px;"></textarea></div>
        <button class="btn bp sm" onclick="addAnn()">Опубликовать</button>
      </div>
    </div>`;
  }
  annEl.innerHTML=annHtml;

  // Stats
  const total=D.books.length;
  const read=D.books.filter(b=>D.statuses[b.id]==='read').length;
  const allQts=Object.values(D.quotes||{}).flat();
  const allCmts=Object.values(D.comments||{}).flat();
  document.getElementById('hm-stats').innerHTML=`
    <div class="sc"><div class="sn">${total}</div><div class="sl">Книг</div></div>
    <div class="sc"><div class="sn">${read}</div><div class="sl">Прочитано</div></div>
    <div class="sc"><div class="sn">${allQts.length}</div><div class="sl">Цитат</div></div>
    <div class="sc"><div class="sn">${allCmts.length}</div><div class="sl">Комментариев</div></div>
  `;

  // Quotes
  const allQ=[];
  D.books.forEach(b=>{
    const bq=D.quotes[b.id]||[];
    bq.forEach(q=>allQ.push({...q,bTitle:b.title,bId:b.id}));
  });
  allQ.sort((a,b)=>(b.date||'')>(a.date||'')?1:-1);
  const qEl=document.getElementById('hm-quotes');
  qEl.innerHTML=allQ.slice(0,5).map(q=>`
    <div class="q-hero" onclick="openBook('${q.bId}')">
      <div class="qt">«${x(q.text)}»</div>
      <div class="qm"><span class="qb">${x(q.bTitle)}</span>${q.by&&q.by!=='Система'?' · '+x(q.by):''}</div>
    </div>
  `).join('')||'<div class="empty">Цитат пока нет — добавьте первую в любой книге!</div>';
}

function renderCatalog(){

  document.getElementById('admin-add-btn').innerHTML=isAdmin()?`<button class="ha" onclick="openAdd()">+ Добавить</button>`:'';
  ['all','read','reading','want'].forEach(k=>{
    const b=document.getElementById('cf-'+k);
    b.style.background=k===catF?'var(--r)':'';b.style.color=k===catF?'white':'';
  });
  // Разделяем книги клуба и личные
  const clubBooks=D.books.filter(b=>!b.personal);
  const personalBooks=D.books.filter(b=>b.personal);
  let books=catF==='all'?[...clubBooks]:clubBooks.filter(b=>D.statuses[b.id]===catF);
  books.sort((a,b)=>(b.readingMonth||'')>(a.readingMonth||'')?1:-1);
  const el=document.getElementById('catalog-list');
  const bookCard=(b,isPersonal)=>{
    const st=D.statuses[b.id];
    const isNew=hasNew(b.id);
    const pg=D.progress[b.id]||0;
    const cvr=coverHtml(b);
    const sgCnt=isPersonal?Object.keys(D.suggestions[b.id]||{}).length:0;
    return `<div class="${isNew?'has-new':''} card" onclick="openBook('${b.id}')" style="cursor:pointer;position:relative;">
      ${isNew?'<span class="new-dot"></span>':''}
      <div class="brow">
        <div class="bcover">${cvr}</div>
        <div class="bi">
          ${isPersonal?`<span class="pbadge">📖 Личная</span>`:`${b.readingMonth?`<span class="mtag">${fmm(b.readingMonth)}</span>`:''}`}
          <div class="bt">${x(b.title)}</div>
          <div class="ba">${b.author?x(b.author):'Автор неизвестен'}</div>
          ${b.yearPublished?`<div class="by2">${b.yearPublished} г.</div>`:''}
          ${!isPersonal&&st?`<span class="bdg b-${st}">${stl(st)}</span>`:''}
          ${!isPersonal&&b.audioUrl?'<span style="font-size:.72rem;color:var(--g);margin-left:4px;font-weight:600;">🎧 аудио</span>':''}
          ${!isPersonal&&pg>0&&pg<100?`<div style="margin-top:5px;font-size:.72rem;color:var(--r);font-weight:600;">${pg}% прочитано</div>`:''}
          ${isPersonal&&sgCnt>0?`<div style="margin-top:5px;font-size:.72rem;color:#5B8DD9;font-weight:600;">💡 ${sgCnt} ${sgCnt===1?'предложение':'предложений'} в клуб</div>`:''}
          ${D.notes[b.id]?isPro()?'<span style="font-size:.68rem;color:var(--g);margin-top:3px;display:block;font-weight:600;">📝 конспект доступен</span>':'<span style="font-size:.68rem;color:var(--r);margin-top:3px;display:block;font-weight:600;">📝 есть конспект · платно</span>':''}
        </div>
      </div>
    </div>`;
  };
  if(!books.length&&catF!=='all'){el.innerHTML='<div class="empty">Нет книг в этой категории</div>';return;}
  const plibSection=catF==='all'&&personalBooks.length?isPro()?`
    <div class="plib-hdr">
      <span>📚 Личная библиотека организатора</span>
      <span class="pbadge">${personalBooks.length} книг</span>
    </div>
    <div style="font-size:.78rem;color:var(--txl);margin-bottom:12px;">Книги, которые уже прочитаны — предлагай читать их в клубе!</div>
    ${personalBooks.map(b=>bookCard(b,true)).join('')}
  `:`
    <div class="plib-hdr">
      <span>📚 Личная библиотека организатора</span>
      <span class="pbadge">${personalBooks.length} книг</span>
    </div>
    <div style="position:relative;border-radius:12px;overflow:hidden;">
      <div class="plib-locked">${personalBooks.slice(0,3).map(b=>bookCard(b,true)).join('')}</div>
      <div class="plib-lock-overlay" onclick="go('profile')">
        <div style="text-align:center;padding:18px;">
          <div style="font-size:2rem;margin-bottom:6px;">🔒</div>
          <div style="font-weight:700;color:var(--rd);font-size:.95rem;margin-bottom:4px;">Личная библиотека закрыта</div>
          <div style="font-size:.78rem;color:var(--txl);margin-bottom:12px;">Доступ открывается после подписки</div>
          <button class="btn bp sm" onclick="event.stopPropagation();go('profile')">Получить доступ →</button>

  `:'';
  el.innerHTML=(books.length?books.map(b=>bookCard(b,false)).join(''):'<div class="empty">Нет книг в этой категории</div>')+plibSection;

function cfilt(f){catF=f;renderCatalog();}
function openAdd(fm){
  if(!isAdmin())return;
  editId=null;
  document.getElementById('add-title').textContent='Добавить книгу';
  ['ab-t','ab-a','ab-y','ab-e','ab-img','ab-au','ab-bk','ab-d'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('ab-m').value=fm||'';
  document.getElementById('addpanel').style.display='block';
  document.getElementById('addpanel').scrollIntoView({behavior:'smooth'});
}
function closeAdd(){document.getElementById('addpanel').style.display='none';editId=null;}
function editBookData(id){
  if(!isAdmin())return;
  const b=D.books.find(b=>b.id===id);if(!b)return;
  editId=id;document.getElementById('add-title').textContent='Редактировать';
  document.getElementById('ab-t').value=b.title||'';document.getElementById('ab-a').value=b.author||'';
  document.getElementById('ab-y').value=b.yearPublished||'';document.getElementById('ab-m').value=b.readingMonth||'';
  document.getElementById('ab-e').value=b.emoji||'';document.getElementById('ab-img').value=b.coverUrl||'';
  document.getElementById('ab-au').value=b.audioUrl||'';document.getElementById('ab-bk').value=b.bookUrl||'';

}
function saveBook(){
  if(!isAdmin())return;
  const t=document.getElementById('ab-t').value.trim();if(!t){alert('Введите название');return;}
  const data={title:t,author:document.getElementById('ab-a').value.trim(),yearPublished:parseInt(document.getElementById('ab-y').value)||null,readingMonth:document.getElementById('ab-m').value,emoji:document.getElementById('ab-e').value.trim()||'📖',coverUrl:document.getElementById('ab-img').value.trim(),audioUrl:document.getElementById('ab-au').value.trim(),bookUrl:document.getElementById('ab-bk').value.trim(),description:document.getElementById('ab-d').value.trim()};
  if(editId){
    const b=D.books.find(b=>b.id===editId);if(b)Object.assign(b,data);
    if(fbOk)fbSet('books/'+editId,{...b});else saveLocal();
  }else{
    const id='b'+Date.now();const nb={...data,id};D.books.push(nb);
    if(fbOk)fbSet('books/'+id,nb);else saveLocal();
  }
  closeAdd();renderCatalog();
}

function bTab(bid,tab,btn){
  document.querySelectorAll(`[id^="btp-"][id$="-${bid}"]`).forEach(p=>p.classList.remove('on'));
  document.getElementById(`btp-${tab}-${bid}`).classList.add('on');
  btn.closest('.tabs').querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function setSt(id,st){
  if(st===null)delete D.statuses[id];else D.statuses[id]=st;
  saveLocal();
  if(fbOk){
    fbSet('userdata/'+userKey()+'/statuses',D.statuses);
    // Write groupstatuses so all participants see each other's counts
    if(!D.groupstatuses[id])D.groupstatuses[id]={};
    if(st===null){
      delete D.groupstatuses[id][userKey()];
      fbDel('groupstatuses/'+id+'/'+userKey());
    }else{
      D.groupstatuses[id][userKey()]=st;
      fbSet('groupstatuses/'+id+'/'+userKey(),st);
    }
  }
  renderBook(id);
}
function setRating(id,r){
  if(!D.ratings)D.ratings={};
  if(!D.ratings[id])D.ratings[id]={};
  D.ratings[id][userKey()]=r;
  saveLocal();
  if(fbOk)fbSet('ratings/'+id+'/'+userKey(),r);
  const el=document.getElementById('stars-'+id);
  if(el)el.querySelectorAll('span[data-v]').forEach(s=>{const v=parseInt(s.dataset.v);s.textContent=v<=r?'★':'☆';s.classList.toggle('on',v<=r);});
}
function setProgress(id){
  const el=document.getElementById('pg-in-'+id);
  const v=Math.min(100,Math.max(0,parseInt(el.value)||0));
  D.progress[id]=v;saveLocal();
  if(fbOk)fbSet('userdata/'+userKey()+'/progress',D.progress);
  renderBook(id);
}
function quickProg(id,v){
  D.progress[id]=v;saveLocal();
  if(fbOk)fbSet('userdata/'+userKey()+'/progress',D.progress);
  renderBook(id);
}
function delBook(id){
  if(!isAdmin())return;
  if(!confirm('Удалить книгу?'))return;
  D.books=D.books.filter(b=>b.id!==id);
  if(fbOk)fbDel('books/'+id);else saveLocal();
  goBack();
}

function renderComments(bid,cmts){
  return`<div id="cmts-inner-${bid}">
    ${cmts.length?cmts.map(c=>renderCmt(bid,c)).join(''):'<div class="empty">Будьте первыми!</div>'}
  </div>
  <div class="card" style="margin-top:12px;">
    <div style="font-size:.8rem;font-weight:700;color:var(--rd);margin-bottom:8px;">Написать комментарий</div>
    <textarea id="nc-${bid}" placeholder="Поделитесь впечатлением..." style="min-height:70px;margin-bottom:8px;"></textarea>
    <button class="btn bp sm" onclick="addCmt('${bid}')">Опубликовать</button>
  </div>`;
}
function renderCmt(bid,c){
  const rxns=mkRxns('cmt',bid,c.id,c.reactions||{});
  const replies=(c.replies||[]).map(r=>`
    <div class="reply">
      <div class="reply-by">${x(r.by||'Аноним')} <span style="color:var(--txl);font-weight:400;">· ${r.date?fmd(r.date):''}</span></div>
      <div>${x(r.text)}</div>
      ${mkRxns('reply',bid,r.id,r.reactions||{},c.id)}
    </div>`).join('');
  return`<div class="cmt">
    <div class="cmt-by">${x(c.by||'Аноним')} <span class="cmt-date">· ${c.date?fmd(c.date):''}</span></div>
    <div class="cmt-txt">${x(c.text)}</div>
    ${rxns}
    <div style="margin-top:7px;" class="row">
      <button class="btn bg2 sm" onclick="toggleReply('${bid}','${c.id}')">↩ Ответить</button>
      ${c.by===D.profile.name||isAdmin()?`<button class="btn bg2 sm" onclick="delCmt('${bid}','${c.id}')">✕</button>`:''}
    </div>
    <div id="rf-${c.id}" style="display:none;margin-top:8px;">
      <div class="row"><input id="ri-${bid}-${c.id}" placeholder="Ваш ответ..." style="flex:1;"/><button class="btn bs sm" onclick="addReply('${bid}','${c.id}')">→</button></div>
    </div>
    ${replies?`<div class="replies">${replies}</div>`:''}
  </div>`;
}
function addCmt(bid){
  const el=document.getElementById('nc-'+bid);const t=el.value.trim();if(!t)return;
  const c={id:'c'+Date.now(),text:t,by:D.profile.name,date:today(),reactions:{},replies:[]};
  if(!D.comments[bid])D.comments[bid]=[];
  D.comments[bid].push(c);
  if(fbOk)fbPush('comments/'+bid,c);else saveLocal();
  el.value='';
  document.getElementById(`btp-cmts-${bid}`).innerHTML=renderComments(bid,D.comments[bid]);
}
function delCmt(bid,cid){
  D.comments[bid]=(D.comments[bid]||[]).filter(c=>c.id!==cid);
  if(fbOk)fbSet('comments/'+bid,D.comments[bid]);else saveLocal();
  document.getElementById(`btp-cmts-${bid}`).innerHTML=renderComments(bid,D.comments[bid]);
}
function toggleReply(bid,cid){const f=document.getElementById('rf-'+cid);if(f)f.style.display=f.style.display==='none'?'block':'none';}
function addReply(bid,cid){
  const el=document.getElementById(`ri-${bid}-${cid}`);const t=el.value.trim();if(!t)return;
  const c=(D.comments[bid]||[]).find(c=>c.id===cid);if(!c)return;
  if(!c.replies)c.replies=[];
  c.replies.push({id:'r'+Date.now(),text:t,by:D.profile.name,date:today(),reactions:{}});
  if(fbOk)fbSet('comments/'+bid,D.comments[bid]);else saveLocal();
  el.value='';
  document.getElementById(`btp-cmts-${bid}`).innerHTML=renderComments(bid,D.comments[bid]);
}

//  REACTIONS
// ══════════════════════════════════════════════
function mkRxns(type,bid,itemId,rxns,parentId){
  const myName=D.profile.name;
  const ctx=JSON.stringify({type,bid,itemId,parentId}).replace(/"/g,'&quot;');
  let html=Object.entries(rxns).map(([e,users])=>{
    const mine=(users||[]).includes(myName);
    return`<button class="rxn ${mine?'mine':''}" onclick='toggleRxn(${JSON.stringify({type,bid,itemId,parentId})},"${e}")'>${e} ${(users||[]).length}</button>`;
  }).join('');
  html+=`<button class="rxn-add" onclick="openRxnPicker(event,${ctx})">＋</button>`;
  return`<div class="rxns">${html}</div>`;
}
function openRxnPicker(e,ctx){
  e.stopPropagation();rxnCtx=ctx;
  const p=document.getElementById('rxn-picker');
  p.style.top=Math.min(e.clientY+8,window.innerHeight-140)+'px';
  p.style.left=Math.min(e.clientX,window.innerWidth-230)+'px';
  p.classList.add('show');
}
function pickRxn(emoji){if(rxnCtx)toggleRxn(rxnCtx,emoji);document.getElementById('rxn-picker').classList.remove('show');rxnCtx=null;}
document.addEventListener('click',()=>{document.getElementById('rxn-picker').classList.remove('show');rxnCtx=null;});

function toggleRxn(ctx,emoji){
  if(typeof ctx==='string')try{ctx=JSON.parse(ctx);}catch(e){}
  const{type,bid,itemId,parentId}=ctx;
  const myName=D.profile.name;
  let item=null,arr=null;
  if(type==='cmt'){arr=D.comments[bid]||[];item=arr.find(c=>c.id===itemId);}
  else if(type==='reply'){const cmt=(D.comments[bid]||[]).find(c=>c.id===parentId);item=cmt&&(cmt.replies||[]).find(r=>r.id===itemId);}
  else if(type==='quote'){arr=D.quotes[bid]||[];item=arr.find(q=>q.id===itemId);}
  else if(type==='ans'){const q=(D.questions[bid]||[]).find(q=>q.id===parentId);item=q&&(q.answers||[]).find(a=>a.id===itemId);}
  if(!item)return;
  if(!item.reactions)item.reactions={};
  if(!item.reactions[emoji])item.reactions[emoji]=[];
  const idx=item.reactions[emoji].indexOf(myName);
  if(idx>=0)item.reactions[emoji].splice(idx,1);else item.reactions[emoji].push(myName);
  if(!item.reactions[emoji].length)delete item.reactions[emoji];
  const path=type==='cmt'||type==='reply'?'comments/'+bid:type==='quote'?'quotes/'+bid:'questions/'+bid;
  const val=type==='cmt'||type==='reply'?D.comments[bid]:type==='quote'?D.quotes[bid]:D.questions[bid];
  if(fbOk)fbSet(path,val);else saveLocal();
  renderBook(bid);
}

function getYears(){
  const now=new Date(),yrs=new Set();
  for(let d=new Date(CLUB_START);d<=now;d.setMonth(d.getMonth()+1))yrs.add(d.getFullYear());
  D.books.forEach(b=>{if(b.readingMonth)yrs.add(parseInt(b.readingMonth.split('-')[0]));});
  return Array.from(yrs).sort();
}
function getMonths(yr){
  const now=new Date(),ms=[];
  for(let m=0;m<12;m++){const d=new Date(yr,m);if(d>=CLUB_START&&d<=new Date(now.getFullYear(),now.getMonth()+1))ms.push(m);}
  return ms;
}
function renderClub(){
  const yrs=getYears();
  if(!selYr||!yrs.includes(selYr))selYr=yrs[yrs.length-1];
  document.getElementById('ytabs').innerHTML=yrs.map(y=>`<button class="yt ${y===selYr?'on':''}" onclick="selY(${y})">${y}</button>`).join('');
  const now=new Date();
  document.getElementById('club-body').innerHTML='<div class="mgrid">'+getMonths(selYr).map(m=>{
    const ym=selYr+'-'+String(m+1).padStart(2,'0');
    const bk=D.books.find(b=>b.readingMonth===ym);
    const isCur=now.getFullYear()===selYr&&now.getMonth()===m;
    return`<div class="mc ${bk?'hb':''} ${isCur?'curr':''}" onclick="${bk?`openBook('${bk.id}')`:isAdmin()?`openAdd('${ym}')`:''}" style="${bk||isAdmin()?'cursor:pointer':'cursor:default'}">
      <div class="mn">${MRU[m]}</div>
      ${bk?`<div style="font-size:1.4rem;margin:3px 0;">${bk.emoji||'📖'}</div><div class="mbt">${x(bk.title)}</div>`:
       isAdmin()?`<div style="font-size:1.2rem;color:var(--bdr);">+</div><div style="font-size:.72rem;color:var(--txl);">Добавить</div>`:`<div style="font-size:.72rem;color:var(--txl);">—</div>`}
      ${isCur?'<div style="font-size:.65rem;color:var(--r);margin-top:4px;font-weight:700;">▶ Сейчас</div>':''}
    </div>`;
  }).join('')+'</div>';
  setTimeout(()=>{renderVoting();renderSuggestionsAdmin();renderMembersClub();},0);
}

function renderVoting(){
  const el=document.getElementById('vote-body');if(!el)return;
  const opts=(D.votes&&D.votes.options)||[];
  const myName=D.profile.name;
  const total=opts.reduce((s,o)=>s+(o.votes||[]).length,0);
  el.innerHTML=opts.map(o=>{
    const cnt=(o.votes||[]).length,pct=total?Math.round(cnt/total*100):0;
    const mine=(o.votes||[]).includes(myName);
    return`<div class="vote-opt ${mine?'voted':''}" onclick="castVote('${o.id}')">
      <div style="flex:1;"><div style="font-size:.88rem;font-weight:600;margin-bottom:5px;">${x(o.title)}</div>
        <div class="vote-bar-wrap"><div class="vote-bar" style="width:${pct}%"></div></div>
      </div>
      <div style="font-size:.8rem;color:var(--txl);min-width:44px;text-align:right;">${pct}% (${cnt})</div>
      ${mine?'<span style="color:var(--r);font-size:.9rem;">✓</span>':''}
      ${isAdmin()?`<button class="btn bg2 sm" style="font-size:.7rem;padding:2px 6px" onclick="event.stopPropagation();delVoteOpt('${o.id}')">✕</button>`:''}
    </div>`;
  }).join('')+(opts.length?'':'<div class="empty">Нет вариантов — предложите книгу!</div>')+
  `<div class="card" style="margin-top:10px;">
    <div class="row"><input id="vote-in" placeholder="Предложить книгу..." style="flex:1;"/><button class="btn bp sm" onclick="addVoteOpt()">Добавить</button></div>
  </div>`;
}
function addVoteOpt(){
  const el=document.getElementById('vote-in');const t=el.value.trim();if(!t)return;
  if(!D.votes)D.votes={options:[]};
  const o={id:'v'+Date.now(),title:t,votes:[]};
  D.votes.options.push(o);
  if(fbOk)fbSet('votes/options',D.votes.options);else saveLocal();
  el.value='';renderVoting();
}
function castVote(oid){
  const myName=D.profile.name;
  (D.votes.options||[]).forEach(o=>{
    if(!o.votes)o.votes=[];
    const idx=o.votes.indexOf(myName);
    if(o.id===oid){if(idx<0)o.votes.push(myName);else o.votes.splice(idx,1);}
  });
  if(fbOk)fbSet('votes/options',D.votes.options);else saveLocal();
  renderVoting();
}
function delVoteOpt(oid){
  D.votes.options=(D.votes.options||[]).filter(o=>o.id!==oid);
  if(fbOk)fbSet('votes/options',D.votes.options);else saveLocal();
  renderVoting();
}

function addSuggestedToVote(bid){
  const b=D.books.find(b=>b.id===bid);if(!b)return;
  if(!D.votes)D.votes={options:[]};
  if(!D.votes.options)D.votes.options=[];
  if(D.votes.options.find(o=>o.title===b.title)){alert('Эта книга уже в голосовании!');return;}
  const o={id:'v'+Date.now(),title:b.title+' ('+b.author+')',votes:[]};
  D.votes.options.push(o);
  if(fbOk)fbSet('votes/options',D.votes.options);else saveLocal();
  renderVoting();
  alert(`«${b.title}» добавлена в голосование!`);
}

// ══════════════════════════════════════════════
//  PERSONAL STATS (profile)
// ══════════════════════════════════════════════
function buildPersonalStats(readBooks){
  if(!readBooks.length)return'';
  const uKey=userKey();
  const myRatings=readBooks.filter(b=>D.ratings&&D.ratings[b.id]&&D.ratings[b.id][uKey]);
  const avgRating=myRatings.length?
    (myRatings.reduce((s,b)=>s+(D.ratings[b.id][uKey]||0),0)/myRatings.length).toFixed(1):null;
  const bestArr=[...myRatings].sort((a,b)=>(D.ratings[b.id]?.[uKey]||0)-(D.ratings[a.id]?.[uKey]||0));
  const best=bestArr[0];
  const myCmts=Object.values(D.comments||{}).flat().filter(c=>c.by===D.profile.name).length;
  const myQts=Object.values(D.quotes||{}).flat().filter(q=>q.by===D.profile.name).length;
  const readMonths=readBooks.map(b=>b.readingMonth).filter(Boolean).sort();
  let streak=0,maxStreak=0,prevYM=null;
  readMonths.forEach(ym=>{
    if(!prevYM){streak=1;}
    else{
      const[py,pm]=prevYM.split('-').map(Number);
      const[cy,cm]=ym.split('-').map(Number);
      const diff=(cy-py)*12+(cm-pm);
      if(diff===1)streak++;else streak=1;
    }
    maxStreak=Math.max(maxStreak,streak);
    prevYM=ym;
  });
  return`<div class="card">
    <h3 style="margin-bottom:12px;">📊 Моя статистика</h3>
    <div class="stat-row">
      ${avgRating?`<div class="sc"><div class="sn">${avgRating}</div><div class="sl">Ср. оценка</div></div>`:''}
      ${maxStreak>1?`<div class="sc"><div class="sn">${maxStreak}</div><div class="sl">Стрик (мес.)</div></div>`:''}
      ${myCmts?`<div class="sc"><div class="sn">${myCmts}</div><div class="sl">Комментов</div></div>`:''}
      ${myQts?`<div class="sc"><div class="sn">${myQts}</div><div class="sl">Цитат</div></div>`:''}
    </div>
    ${best?`<div style="font-size:.8rem;color:var(--txl);margin-top:8px;">⭐ Лучшая книга: <b style="color:var(--rd);">${x(best.title)}</b> (${D.ratings[best.id][uKey]}/5)</div>`:''}
  </div>`;
}

let coverCache={};
function initCoverCache(){
  try{const s=localStorage.getItem('vrk-covers');if(s)coverCache=JSON.parse(s);}catch(e){}
}
function fetchMissingCovers(){
  const missing=D.books.filter(b=>!b.personal&&!b.coverUrl&&!coverCache[b.id]);
  if(!missing.length)return;
  let i=0;
  function next(){
    if(i>=missing.length)return;
    const b=missing[i++];
    // Use Open Library search by title — returns cover_i (cover ID)
    const q=encodeURIComponent(b.title);
    fetch(`https://openlibrary.org/search.json?title=${q}&limit=1&fields=cover_i,title`)
      .then(r=>r.json())
      .then(data=>{
        const doc=data&&data.docs&&data.docs[0];
        const coverId=doc&&doc.cover_i;
        if(coverId){
          coverCache[b.id]=`https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;
          try{localStorage.setItem('vrk-covers',JSON.stringify(coverCache));}catch(e){}
          renderIfActive('catalog');renderIfActive('home');
          if(curV==='book'&&curBk===b.id)renderBook(b.id);
        }
        setTimeout(next,400);
      })
      .catch(()=>setTimeout(next,400));
  }
  next();
}
function coverHtml(b){
  const url=coverCache[b.id]||b.coverUrl||'';
  if(url)return`<img src="${x(url)}" alt="" style="width:52px;height:74px;object-fit:cover;border-radius:6px;flex-shrink:0;">`;
  return`<div style="width:52px;height:74px;background:linear-gradient(135deg,var(--r),var(--rl));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;">${b.emoji||'📖'}</div>`;
}
function coverHtmlLg(b){
  const url=coverCache[b.id]||b.coverUrl||'';
  if(url)return`<img src="${x(url)}" alt="" style="width:100px;min-height:140px;object-fit:cover;border-radius:10px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.18);">`;
  return`<div style="width:100px;min-height:140px;background:linear-gradient(135deg,var(--r),var(--rl));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:3rem;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.15);">${b.emoji||'📖'}</div>`;

function fetchAdaptation(bid,title,author){
  if(TMDB_KEY==='ВСТАВЬТЕ_КЛЮЧ_TMDB'){syncShow('','<div style="text-align:center;font-size:.82rem;">Для поиска экранизаций нужен бесплатный ключ TMDB.<br><a href="https://www.themoviedb.org/settings/api" target="_blank" style="color:var(--r);">Получить бесплатно →</a></div>');setTimeout(syncHide,4000);return;}
  syncShow('🔍 Ищем экранизации...','');
  const q=encodeURIComponent(title);
  fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${q}&language=ru-RU`)
    .then(r=>r.json())
    .then(data=>{
      syncHide();
      const results=(data.results||[]).filter(r=>r.media_type==='movie'||r.media_type==='tv').slice(0,8);
      if(!results.length){alert('Экранизации не найдены');return;}
      if(!D.adaptations)D.adaptations={};
      D.adaptations[bid]=results.map(r=>({tmdbId:r.id,type:r.media_type,title:r.title||r.name,year:(r.release_date||r.first_air_date||'').slice(0,4),poster:r.poster_path}));
      if(fbOk)fbSet('adaptations/'+bid,D.adaptations[bid]);else saveLocal();
      renderBook(bid);
      setTimeout(()=>{const el=document.getElementById('adapt-sec-'+bid);if(el)el.scrollIntoView({behavior:'smooth'});},100);
    })
    .catch(e=>{syncHide();alert('Ошибка поиска: '+e.message);});
}

function audToggle(id){
  const a=document.getElementById('aud-'+id);
  const btn=document.getElementById('aplay-'+id);
  if(!a)return;
  if(a.paused){a.play();btn.textContent='⏸';}
  else{a.pause();btn.textContent='▶';}
  audBind(id);
}
function audBind(id){
  const a=document.getElementById('aud-'+id);
  if(!a||a._bound)return;
  a._bound=true;
  a.addEventListener('timeupdate',()=>{
    const cur=document.getElementById('acur-'+id);
    const prog=document.getElementById('aprog-'+id);
    if(cur)cur.textContent=audFmt(a.currentTime);
    if(prog&&a.duration)prog.style.width=(a.currentTime/a.duration*100)+'%';
  });
  a.addEventListener('loadedmetadata',()=>{
    const dur=document.getElementById('adur-'+id);
    if(dur)dur.textContent=audFmt(a.duration);
  });
  a.addEventListener('ended',()=>{
    const btn=document.getElementById('aplay-'+id);
    if(btn)btn.textContent='▶';
    const prog=document.getElementById('aprog-'+id);
    if(prog)prog.style.width='0%';
  });
}
function audSkip(id,sec){
  const a=document.getElementById('aud-'+id);
  if(!a)return;
  a.currentTime=Math.max(0,Math.min(a.duration||0,a.currentTime+sec));
  audBind(id);
}
function audSpeed(id,rate,btn){
  const a=document.getElementById('aud-'+id);
  if(!a)return;
  a.playbackRate=rate;
  document.querySelectorAll(`#apl-${id} .apl-sp`).forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function audSeek(e,id){
  const a=document.getElementById('aud-'+id);
  const bar=e.currentTarget;
  if(!a||!a.duration)return;
  const rect=bar.getBoundingClientRect();
  a.currentTime=((e.clientX-rect.left)/rect.width)*a.duration;
  audBind(id);
}
function audFmt(s){
  if(!s||isNaN(s))return'0:00';
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}
function savePlaylistUrl(id){
  const inp=document.getElementById('pl-url-'+id);if(!inp)return;
  const url=inp.value.trim();
  const b=D.books.find(b=>b.id===id);if(!b)return;
  b.audioUrl=url;
  if(fbOk)fbSet('books/'+id,b);else saveLocal();
  document.getElementById('playlist-sec-'+id).innerHTML=renderPlaylist(id,b);
}

    const opt={
      margin:[15,20,15,20],
      filename:`Конспект_${(b.title||bid).replace(/[^\wа-яёА-ЯЁ ]/gi,'_')}.pdf`,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],before:'h1'}
    };
    window.html2pdf().set(opt).from(wrap).save()
      .catch(e=>alert('Ошибка генерации PDF: '+e.message));
  };
  if(window.html2pdf){doGen();}
  else{
    syncShow('⬇','Загружаем генератор PDF...');
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload=()=>{syncHide();doGen();};
    s.onerror=()=>{syncHide();alert('Не удалось загрузить библиотеку PDF. Проверь соединение.');};
    document.head.appendChild(s);
  }
}

function notionToHtml(text){
  if(!text)return'';
  let t=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/&lt;callout[^&]*icon="([^"]*)"[^&]*&gt;([\s\S]*?)&lt;\/callout&gt;/g,
    (_,ico,txt)=>`<div class="note-callout"><span class="ico">${ico}</span><span class="txt">${txt.trim()}</span></div>`);
  t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t=t.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  t=t.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t=t.replace(/^---$/gm,'<hr>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  t=t.replace(/^[-•] (.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
  t=t.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  t=t.replace(/^(?!<[hul]|<li|<hr|<block|<div)(.+)$/gm,'<p>$1</p>');
  t=t.replace(/\n{3,}/g,'\n\n');
  return t;
}

function yyyymm(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}

function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
